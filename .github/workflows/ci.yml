name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: kontextmind_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://test:test@localhost:5432/kontextmind_test
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/kontextmind_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Apply migrations
        run: bun run db:migrate
      - name: Tests (incl. isolation harness)
        run: bun test
      # Branch protection MUST mark this job required: the isolation harness
      # is the cross-tenant deny gate (docs/authz-matrix.md).
