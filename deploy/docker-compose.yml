# KontextMind demo stack (board decisions D3/D4):
#   bun run seed          # synthesizes demo/mind with dated git history
#   docker compose up     # db + server, indexes the mind at boot
# Then:
#   cd cli && bun run src/index.ts search "what database does KontextMind use"
# or wire any MCP client to http://localhost:3000/mcp (token: km-demo-local)

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kontextmind
      POSTGRES_USER: kontextmind
      POSTGRES_PASSWORD: kontextmind-dev-only
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kontextmind"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://kontextmind:kontextmind-dev-only@db:5432/kontextmind
      KM_MODE: demo
      KM_DEMO_TOKEN: km-demo-local
      KM_APP_PASSWORD: km-demo-local
      KM_MIND_PATH: /mind
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - ../demo/mind:/mind:ro

volumes:
  dbdata:
